[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "racetrack"
version = "0.1.0"
description = "Partition and kernel benchmark harness for flattened DeepSeek-style model paths."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "torch",
]

[project.optional-dependencies]
triton = ["triton"]
backends = ["helion", "nvidia-cutlass-dsl"]
dev = ["pytest"]

[project.scripts]
racetrack-bench = "racetrack.bench:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["racetrack*", "benchmarks*", "partitions*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
